<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>今日待辦</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">TODAY, AT YOUR PACE</p>
        <h1>今日待辦<span class="title-period">.</span></h1>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切換深色模式">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <span class="theme-label">深色模式</span>
      </button>
    </header>

    <section class="todo-panel" aria-label="待辦清單">
      <form class="todo-form" id="todo-form">
        <label class="visually-hidden" for="todo-input">新增待辦事項</label>
        <input id="todo-input" name="todo" type="text" maxlength="200" placeholder="接下來要完成什麼？" autocomplete="off" required>
        <button class="add-button" type="submit"><span aria-hidden="true">+</span> 新增</button>
      </form>

      <nav class="filter-bar" aria-label="篩選待辦事項">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </nav>

      <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state" hidden></p>

      <footer class="list-footer">
        <p id="remaining-count">未完成：0 項</p>
        <span class="footer-mark" aria-hidden="true">慢慢來，也算前進</span>
      </footer>
    </section>
  </main>
</body>
</html>
